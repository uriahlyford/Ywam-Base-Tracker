<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YWAM Cambodia — Ministry Survey</title>
  <meta name="description" content="Each regional leader reports the ministries they oversee: where they are, who leads them, how many staff, and who they reach." />
  <meta name="robots" content="noindex" />
  <!-- The tab icon is the YWAM figure on its own, not the whole mark. At 16px the
       Cambodia outline in logo.svg collapses into a blue smudge; the figure still
       reads. Same artwork, cropped to the part that survives being that small. -->
  <link rel="icon" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/icon-180.png" />
  <!-- No webfont on purpose. These are phones on Cambodian mobile data; a
       blocking stylesheet from another host is a slow first paint at best and a
       blank page at worst. The system font stack in styles.css loads instantly. -->
  <link rel="stylesheet" href="/styles.css" />
  <meta name="theme-color" content="#FFFFFF" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">
        <!-- One logo.svg for both the topbar and the results hero, so the mark
             cannot drift between them. width/height are set so the header does
             not reflow when the file lands on a slow connection. -->
        <span class="brand-mark" aria-hidden="true">
          <img src="/logo.svg" width="46" height="37" alt="" />
        </span>
        <span class="brand-text">
          <span class="brand-title">YWAM Cambodia</span>
          <span class="brand-sub">Ministry survey</span>
        </span>
      </a>
      <span class="saved-flag" id="saved-flag" hidden>Draft saved</span>
    </div>
    <!-- Totals first, and the landing page: a leader should see what the whole
         thing is for before being asked to fill anything in. -->
    <nav class="tabs">
      <button class="tab active" data-goto="results" id="tab-results" type="button">At a glance</button>
      <!-- "My report" read like a place to go and look at something. This is the
           half of the app where a leader puts numbers in, and the label should
           say so before they tap it. -->
      <button class="tab" data-goto="form" id="tab-form" type="button">Enter a report</button>
    </nav>
  </header>

  <main id="app" class="app"></main>

  <!-- The province sheet lives outside #app so opening it does not re-render the
       totals — a re-render scrolls back to the top, which would throw away the
       reader's place the moment they tapped a province halfway down the list. -->
  <div id="sheet"></div>

  <footer class="footer">
    <p>Your draft is saved on this device as you type, so you can stop and come back.</p>
  </footer>

  <script src="/provinces.js"></script>
  <script src="/options.js"></script>
  <script src="/survey.js"></script>
</body>
</html>
